quarkus.http.port=8080
quarkus.log.redirect-console=false
temporal.target=localhost:7233
temporal.namespace=scan-platform
temporal.tls.enabled=false
temporal.tls.client-cert-path=
temporal.tls.client-key-path=
temporal.tls.server-ca-path=

smallrye.jwt.path.groups=role
# /scans requires a JWT with role security:scan:submitter; /health stays open for probes.
# Configure MP_JWT_VERIFY_PUBLICKEY_LOCATION (file/classpath/URL) or MP_JWT_VERIFY_PUBLICKEY (PEM text).
mp.jwt.verify.issuer=${MP_JWT_VERIFY_ISSUER:https://autotriage.local}
