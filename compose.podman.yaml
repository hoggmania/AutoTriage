services:
  scan-api:
    build:
      context: .
      dockerfile: docker/scan-api.Dockerfile
    environment:
      - TEMPORAL_TARGET=${TEMPORAL_TARGET:-host.containers.internal:7233}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-scan-platform}
      - TEMPORAL_TLS_ENABLED=${TEMPORAL_TLS_ENABLED:-false}
    ports:
      - "8080:8080"

  scan-worker-workflow:
    build:
      context: .
      dockerfile: docker/scan-worker-workflow.Dockerfile
    environment:
      - TEMPORAL_TARGET=${TEMPORAL_TARGET:-host.containers.internal:7233}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-scan-platform}
      - TEMPORAL_TLS_ENABLED=${TEMPORAL_TLS_ENABLED:-false}

  scan-worker-light:
    build:
      context: .
      dockerfile: docker/scan-worker-light.Dockerfile
    environment:
      - TEMPORAL_TARGET=${TEMPORAL_TARGET:-host.containers.internal:7233}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-scan-platform}
      - TEMPORAL_TLS_ENABLED=${TEMPORAL_TLS_ENABLED:-false}
      - SUPPRESSION_SERVICE_URL=${SUPPRESSION_SERVICE_URL:-http://suppression-service-mock:8090}
      - ARTIFACTS_DIR=/artifacts
      - GIT_CLONE_TOKEN
    volumes:
      - artifacts:/artifacts
    depends_on:
      - suppression-service-mock

  scan-worker-filter:
    build:
      context: .
      dockerfile: docker/scan-worker-filter.Dockerfile
    environment:
      - TEMPORAL_TARGET=${TEMPORAL_TARGET:-host.containers.internal:7233}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-scan-platform}
      - TEMPORAL_TLS_ENABLED=${TEMPORAL_TLS_ENABLED:-false}
      - TRIAGE_SERVICE_URL=${TRIAGE_SERVICE_URL:-http://triage-service:8095}
      - TRIAGE_INGEST_TOKEN=${TRIAGE_INGEST_TOKEN}
      - ARTIFACTS_DIR=/artifacts
    volumes:
      - artifacts:/artifacts

  scan-worker-opengrep:
    build:
      context: .
      dockerfile: docker/scan-worker-opengrep.Dockerfile
    environment:
      - TEMPORAL_TARGET=${TEMPORAL_TARGET:-host.containers.internal:7233}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-scan-platform}
      - TEMPORAL_TLS_ENABLED=${TEMPORAL_TLS_ENABLED:-false}
      - ARTIFACTS_DIR=/artifacts
      - OPENGREP_BIN
      - OPENGREP_CONFIG
    volumes:
      - artifacts:/artifacts

  suppression-service-mock:
    build:
      context: .
      dockerfile: docker/suppression-service-mock.Dockerfile
    ports:
      - "8090:8090"

  triage-db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${DB_NAME:-autotriage}
      - POSTGRES_USER=${DB_USER:-autotriage}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-autotriage}
    ports:
      - "5432:5432"
    volumes:
      - triage-db:/var/lib/postgresql/data

  triage-service:
    build:
      context: .
      dockerfile: docker/triage-service.Dockerfile
    environment:
      - DB_HOST=triage-db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-autotriage}
      - DB_USER=${DB_USER:-autotriage}
      - DB_PASSWORD=${DB_PASSWORD:-autotriage}
      - TRIAGE_POLICY_PATH=${TRIAGE_POLICY_PATH:-.autotriage/policy.cel}
      - TRIAGE_POLICY_CACHE_MINUTES=${TRIAGE_POLICY_CACHE_MINUTES:-5}
      - TRIAGE_PR_URL_TEMPLATE=${TRIAGE_PR_URL_TEMPLATE:-}
      - TRIAGE_INGEST_TOKEN=${TRIAGE_INGEST_TOKEN}
      - TRIAGE_REPOSITORY_ALLOWED_HOSTS=${TRIAGE_REPOSITORY_ALLOWED_HOSTS:-github.com}
      - MP_JWT_VERIFY_PUBLICKEY_LOCATION=${MP_JWT_VERIFY_PUBLICKEY_LOCATION:-}
    ports:
      - "8095:8095"
    depends_on:
      - triage-db

volumes:
  artifacts: {}
  triage-db: {}
