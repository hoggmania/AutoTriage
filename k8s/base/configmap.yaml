apiVersion: v1
kind: ConfigMap
metadata:
  name: autotriage-config
data:
  TEMPORAL_TARGET: "temporal.autotriage.svc.cluster.local:7233"
  TEMPORAL_NAMESPACE: "scan-platform"
  TEMPORAL_TLS_ENABLED: "false"
  TEMPORAL_TLS_CLIENT_CERT_PATH: "/etc/temporal-tls/tls.crt"
  TEMPORAL_TLS_CLIENT_KEY_PATH: "/etc/temporal-tls/tls.key"
  TEMPORAL_TLS_SERVER_CA_PATH: "/etc/temporal-tls/ca.crt"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "autotriage"
  TRIAGE_SERVICE_URL: "http://triage-service:8095"
  TRIAGE_REPOSITORY_ALLOWED_HOSTS: "github.com"
  MP_JWT_VERIFY_ISSUER: "https://autotriage.local"
  ARTIFACT_S3_ENDPOINT: "http://minio:9000"
  ARTIFACT_S3_REGION: "us-east-1"
  ARTIFACT_S3_BUCKET: "autotriage-artifacts"
  ARTIFACT_S3_PATH_STYLE_ACCESS: "true"
  AWS_REGION: "us-east-1"
  AWS_ENDPOINT_URL_S3: "http://minio:9000"
