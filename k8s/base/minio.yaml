apiVersion: v1
kind: Service
metadata:
  name: minio
  labels: {app.kubernetes.io/name: minio, app.kubernetes.io/component: object-storage}
spec:
  selector: {app.kubernetes.io/name: minio}
  ports:
    - {name: api, port: 9000, targetPort: api}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels: {app.kubernetes.io/name: minio, app.kubernetes.io/component: object-storage}
spec:
  serviceName: minio
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: minio}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: minio, app.kubernetes.io/component: object-storage}
    spec:
      serviceAccountName: minio
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: ["server", "/data"]
          ports: [{name: api, containerPort: 9000}]
          env:
            - {name: MINIO_ROOT_USER, valueFrom: {secretKeyRef: {name: autotriage-runtime, key: S3_ACCESS_KEY}}}
            - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: autotriage-runtime, key: S3_SECRET_KEY}}}
            - {name: HOME, value: /tmp}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          startupProbe: {httpGet: {path: /minio/health/live, port: api}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /minio/health/ready, port: api}, periodSeconds: 10, timeoutSeconds: 2}
          livenessProbe: {httpGet: {path: /minio/health/live, port: api}, periodSeconds: 20, timeoutSeconds: 2, failureThreshold: 3}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  labels: {app.kubernetes.io/name: minio-bucket-init, app.kubernetes.io/component: object-storage-init}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: {app.kubernetes.io/name: minio-bucket-init, app.kubernetes.io/component: object-storage-init}
    spec:
      serviceAccountName: minio-bucket-init
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: create-bucket
          image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              until mc alias set local http://minio:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY"; do sleep 2; done;
              mc mb --ignore-existing local/autotriage-artifacts
          envFrom: [{secretRef: {name: autotriage-runtime}}]
          env: [{name: HOME, value: /tmp}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 128Mi}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
