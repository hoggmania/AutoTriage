apiVersion: v1
kind: Service
metadata:
  name: scan-api
  labels: {app.kubernetes.io/name: scan-api}
spec:
  selector: {app.kubernetes.io/name: scan-api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scan-api
  labels: {app.kubernetes.io/name: scan-api, app.kubernetes.io/component: api}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: scan-api}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: scan-api, app.kubernetes.io/component: api}
    spec:
      serviceAccountName: scan-api
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      terminationGracePeriodSeconds: 30
      containers:
        - name: scan-api
          image: autotriage/scan-api:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: autotriage-config}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
          startupProbe: {tcpSocket: {port: http}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10, timeoutSeconds: 2}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 20, timeoutSeconds: 2, failureThreshold: 3}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: temporal-tls, mountPath: /etc/temporal-tls, readOnly: true}]
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
        - name: temporal-tls
          secret: {secretName: temporal-tls, optional: true, defaultMode: 256}
---
apiVersion: v1
kind: Service
metadata:
  name: triage-service
  labels: {app.kubernetes.io/name: triage-service}
spec:
  selector: {app.kubernetes.io/name: triage-service}
  ports: [{name: http, port: 8095, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-service
  labels: {app.kubernetes.io/name: triage-service, app.kubernetes.io/component: triage}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: triage-service}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: triage-service, app.kubernetes.io/component: triage}
    spec:
      serviceAccountName: triage-service
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: wait-for-postgres
          image: postgres:16.4
          command: ["sh", "-ec", "until pg_isready -h \"$DB_HOST\" -p \"$DB_PORT\" -U \"$DB_USER\"; do sleep 2; done"]
          envFrom: [{configMapRef: {name: autotriage-config}}, {secretRef: {name: autotriage-runtime}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
      containers:
        - name: triage-service
          image: autotriage/triage-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8095}]
          envFrom: [{configMapRef: {name: autotriage-config}}, {secretRef: {name: autotriage-runtime}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 150m, memory: 384Mi}, limits: {cpu: "1", memory: 768Mi}}
          startupProbe: {tcpSocket: {port: http}, failureThreshold: 36, periodSeconds: 5}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10, timeoutSeconds: 2}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 20, timeoutSeconds: 2, failureThreshold: 3}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 256Mi}}]
---
