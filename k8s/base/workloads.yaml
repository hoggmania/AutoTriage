apiVersion: apps/v1
kind: Deployment
metadata:
  name: scan-worker-opengrep
  labels: {app.kubernetes.io/name: scan-worker-opengrep, app.kubernetes.io/component: worker}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: scan-worker-opengrep}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: scan-worker-opengrep, app.kubernetes.io/component: worker, autotriage.io/worker-class: opengrep}
    spec:
      serviceAccountName: scan-worker-opengrep
      automountServiceAccountToken: false
      runtimeClassName: autotriage-sandbox
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: {matchLabels: {app.kubernetes.io/name: scan-worker-opengrep}}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: scan-worker-opengrep
          image: autotriage/scan-worker-opengrep:latest
          envFrom: [{configMapRef: {name: autotriage-config}}, {secretRef: {name: autotriage-runtime}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 500m, memory: 1Gi, ephemeral-storage: 1Gi}, limits: {cpu: "2", memory: 3Gi, ephemeral-storage: 4Gi}}
          startupProbe: {exec: {command: ["sh", "-c", "kill -0 1"]}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {exec: {command: ["sh", "-c", "kill -0 1"]}, periodSeconds: 10, timeoutSeconds: 2}
          livenessProbe: {exec: {command: ["sh", "-c", "kill -0 1"]}, periodSeconds: 20, timeoutSeconds: 2, failureThreshold: 3}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: workspace, mountPath: /workspace}
            - {name: temporal-tls, mountPath: /etc/temporal-tls, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 512Mi}}
        - {name: workspace, emptyDir: {sizeLimit: 4Gi}}
        - name: temporal-tls
          secret: {secretName: temporal-tls, optional: true, defaultMode: 256}
