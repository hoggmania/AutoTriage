apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: autotriage-sandbox
handler: runsc
overhead:
  podFixed: {cpu: 50m, memory: 64Mi}
scheduling:
  nodeSelector:
    autotriage.io/sandbox-runtime: gvisor
  tolerations:
    - {key: autotriage.io/sandbox, operator: Equal, value: gvisor, effect: NoSchedule}
