apiVersion: apps/v1
kind: Deployment
metadata: {name: scan-api}
spec:
  template:
    spec:
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: scan-api}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: triage-service}
spec:
  template:
    spec:
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: triage-service}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: scan-worker-opengrep}
spec:
  template:
    spec:
      nodeSelector: {autotriage.io/sandbox-runtime: gvisor}
      tolerations:
        - {key: autotriage.io/sandbox, operator: Equal, value: gvisor, effect: NoSchedule}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app.kubernetes.io/name: scan-worker-opengrep}}}
