apiVersion: v1
kind: Secret
metadata:
  name: autotriage-runtime
  namespace: autotriage
type: Opaque
stringData:
  DB_USER: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
  TRIAGE_INGEST_TOKEN: "REPLACE_ME"
  # Omit S3 keys when workload identity supplies credentials.
  S3_ACCESS_KEY: "REPLACE_ME_OR_REMOVE"
  S3_SECRET_KEY: "REPLACE_ME_OR_REMOVE"
  AWS_ACCESS_KEY_ID: "REPLACE_ME_OR_REMOVE"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME_OR_REMOVE"
  # Add provider-specific GitHub App and KMS settings expected by the service.
  GITHUB_APP_ID: "REPLACE_ME"
  GITHUB_APP_PRIVATE_KEY: "REPLACE_ME"
  AWS_KMS_KEY_ARN: "REPLACE_ME"
