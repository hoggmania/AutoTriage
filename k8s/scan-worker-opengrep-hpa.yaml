apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scan-worker-opengrep
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scan-worker-opengrep
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
