apiVersion: apps/v1
kind: Deployment
metadata:
  name: scan-worker-filter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scan-worker-filter
  template:
    metadata:
      labels:
        app: scan-worker-filter
    spec:
      containers:
        - name: scan-worker-filter
          image: autotriage/scan-worker-filter:latest
          envFrom:
            - configMapRef:
                name: autotriage-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
            - name: temporal-tls
              mountPath: /etc/temporal-tls
              readOnly: true
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: autotriage-artifacts
        - name: temporal-tls
          secret:
            secretName: temporal-tls
