quarkus.http.port=8095

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:autotriage}
quarkus.datasource.password=${DB_PASSWORD:autotriage}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autotriage}

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

smallrye.jwt.path.groups=role
# Triage APIs require JWT verification in runtime environments.
# Configure MP_JWT_VERIFY_PUBLICKEY_LOCATION (file/classpath/URL) or
# MP_JWT_VERIFY_PUBLICKEY (PEM text). MicroProfile Config maps those environment
# variables to mp.jwt.verify.publickey.location and mp.jwt.verify.publickey.
mp.jwt.verify.issuer=${MP_JWT_VERIFY_ISSUER:https://autotriage.local}

# Repository-managed CEL policy cloning is disabled unless repositories are explicitly allowlisted.
triage.policy.repository-allowlist=${TRIAGE_POLICY_REPOSITORY_ALLOWLIST:}

# Required for worker-to-triage candidate ingestion. Leave unset to reject ingestion.
triage.ingest.allow-unauthenticated=false
triage.repository.allowed-hosts=${TRIAGE_REPOSITORY_ALLOWED_HOSTS:github.com}

# Asymmetric KMS key used for detached suppression signature envelopes.
suppression.signature.kms-key-arn=${SUPPRESSION_SIGNATURE_KMS_KEY_ARN:}
