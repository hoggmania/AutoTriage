quarkus.http.port=8095

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:autotriage}
quarkus.datasource.password=${DB_PASSWORD:autotriage}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autotriage}

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

smallrye.jwt.path.groups=role
