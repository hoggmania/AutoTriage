quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:triage;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

mp.jwt.verify.publickey.location=jwt-public-key.pem
mp.jwt.verify.issuer=https://autotriage.test
smallrye.jwt.path.groups=role
triage.ingest.allow-unauthenticated=false
triage.ingest.token=test-ingest-token
triage.repository.allowed-hosts=github.com,example.com
triage.policy.repository-allowlist=https://example.com/repo.git
