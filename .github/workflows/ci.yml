name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and test modules
        run: mvn -B -pl scan-common,scan-api,scan-worker-workflow,scan-worker-light,scan-worker-filter,scan-worker-opengrep,suppression-service-mock -am verify
