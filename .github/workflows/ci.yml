name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Verify MIT license
        run: |
          test -f LICENSE
          grep -Fq "Permission is hereby granted, free of charge" LICENSE

      - name: Show Maven toolchain
        run: mvn --version

      - name: Build and test reactor
        run: mvn -B verify
